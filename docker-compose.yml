services:

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hospital_ai_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hospital_db

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./data:/app/data

    restart: unless-stopped


  # PostgreSQL database with pgvector
  db:
    image: pgvector/pgvector:pg16

    container_name: hospital_ai_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


volumes:
  postgres_data: